name: Deploy Centrifugo realtime service

# Creates/updates the dedicated Centrifugo service on Railway from the
# checked-in deploy/centrifugo/ config, provisions its public domain,
# and writes the matching CENTRIFUGO_* variables onto the SA backend
# service. employee-api lives in a different Railway project — its
# variables are set by the employee repo's own centrifugo-vars workflow.
#
# Secrets come from repo secrets (set once on both repos):
#   CENTRIFUGO_TOKEN_SECRET  == Centrifugo client HMAC secret
#   CENTRIFUGO_API_KEY       == Centrifugo HTTP API key
#
# Idempotent: existing service/domain are reused.

on:
  workflow_dispatch:

concurrency:
  group: centrifugo-deploy
  cancel-in-progress: false

env:
  RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
  SA_SERVICE_ID: dc288dfb-c372-4bf3-aae8-a5c99f479767
  SA_ENVIRONMENT_ID: 7a18babb-4b19-4cf1-9c9d-c2d9747cc319
  CENTRIFUGO_TOKEN_SECRET: ${{ secrets.CENTRIFUGO_TOKEN_SECRET }}
  CENTRIFUGO_API_KEY: ${{ secrets.CENTRIFUGO_API_KEY }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Railway CLI
        run: npm install --global @railway/cli

      - name: Preflight — secrets present
        run: |
          if [ -z "$CENTRIFUGO_TOKEN_SECRET" ] || [ -z "$CENTRIFUGO_API_KEY" ]; then
            echo "::error::Set repo secrets CENTRIFUGO_TOKEN_SECRET and CENTRIFUGO_API_KEY first"
            exit 1
          fi
          echo "::add-mask::$CENTRIFUGO_TOKEN_SECRET"
          echo "::add-mask::$CENTRIFUGO_API_KEY"
          echo "secrets present"

      - name: Resolve project, environment and services
        id: ids
        run: |
          set -e
          railway api 'query { service(id: "'"$SA_SERVICE_ID"'") { projectId name } }' > /tmp/svc.json
          railway api 'query { environment(id: "'"$SA_ENVIRONMENT_ID"'") { name } }' > /tmp/env.json || true
          railway service list --json > /tmp/svcs.json || echo '[]' > /tmp/svcs.json
          python3 - <<'PY'
          import json, os
          svc = json.load(open("/tmp/svc.json"))
          node = (svc.get("data") or {}).get("service")
          if not node:
              raise SystemExit(f"service query failed: {svc}")
          proj = node["projectId"]
          print("projectId:", proj, "sa service:", node["name"])
          try:
              env_name = json.load(open("/tmp/env.json"))["data"]["environment"]["name"]
          except Exception:
              env_name = "production"
          raw = json.load(open("/tmp/svcs.json"))
          svcs = raw if isinstance(raw, list) else raw.get("services", [])
          names = {s.get("name") or "": (s.get("id") or s.get("serviceId") or "") for s in svcs}
          print("services:", names, "env:", env_name)
          out = open(os.environ["GITHUB_OUTPUT"], "a")
          out.write(f"project_id={proj}\nenvironment_name={env_name}\n")
          out.write(f"sa_service={node['name']}\n")
          out.write(f"cf_service_id={names.get('centrifugo','')}\n")
          out.write(f"eb_service={'employee-api' if 'employee-api' in names else ''}\n")
          PY

      - name: Create Centrifugo service (if absent)
        id: svc
        env:
          PID: ${{ steps.ids.outputs.project_id }}
          CF_ID: ${{ steps.ids.outputs.cf_service_id }}
        run: |
          set -e
          if [ -n "$CF_ID" ]; then
            echo "service_id=$CF_ID" >> "$GITHUB_OUTPUT"
            echo "centrifugo service already exists: $CF_ID"
          else
            python3 -c 'import json,os;json.dump({"input":{"projectId":os.environ["PID"],"name":"centrifugo"}},open("/tmp/v.json","w"))'
            railway api 'mutation($i: ServiceCreateInput!){ serviceCreate(input: $i) { id name } }' \
              --variables @/tmp/v.json | tee /tmp/svc.json
            SID=$(python3 -c 'import json;print(json.load(open("/tmp/svc.json"))["data"]["serviceCreate"]["id"])')
            echo "service_id=$SID" >> "$GITHUB_OUTPUT"
          fi

      - name: Deploy deploy/centrifugo to the service
        working-directory: deploy/centrifugo
        env:
          RAILWAY_PROJECT_ID: ${{ steps.ids.outputs.project_id }}
          RAILWAY_ENVIRONMENT: ${{ steps.ids.outputs.environment_name }}
        run: railway up --service centrifugo --ci

      - name: Wait for deployment success
        run: |
          set -e
          for i in 1 2 3 4 5 6; do
            sleep 30
            DEP=$(railway api 'query { deployments(first: 1, input: { serviceId: "'"${{ steps.svc.outputs.service_id }}"'", environmentId: "'"$SA_ENVIRONMENT_ID"'" }) { edges { node { id status } } } }' \
              | python3 -c 'import json,sys; n=json.load(sys.stdin)["data"]["deployments"]["edges"][0]["node"]; print(n["id"], n["status"])' || echo "poll-error")
            echo "poll $i: $DEP"
            case "$DEP" in
              *SUCCESS) exit 0 ;;
              *FAILED|*CRASHED) echo "deployment failed" && exit 1 ;;
            esac
          done
          echo "deployment did not succeed in time" && exit 1

      - name: Ensure public service domain
        id: dom
        env:
          CF_ID: ${{ steps.svc.outputs.service_id }}
          PID: ${{ steps.ids.outputs.project_id }}
        run: |
          set -e
          railway api 'query { domains(projectId: "'"$PID"'", environmentId: "'"$SA_ENVIRONMENT_ID"'", serviceId: "'"$CF_ID"'") }' > /tmp/doms.json || echo '{}' > /tmp/doms.json
          D=$(python3 -c 'import json
          d=json.load(open("/tmp/doms.json")).get("data",{}).get("domains") or {}
          s=d.get("serviceDomains") or []
          print(s[0]["domain"] if s else "")')
          if [ -z "$D" ]; then
            railway api 'mutation { serviceDomainCreate(input: { serviceId: "'"$CF_ID"'", environmentId: "'"$SA_ENVIRONMENT_ID"'", targetPort: 8000 }) { domain } }' | tee /tmp/dom.json
            D=$(python3 -c 'import json;print(json.load(open("/tmp/dom.json"))["data"]["serviceDomainCreate"]["domain"])')
          fi
          [ -n "$D" ] || { echo "::error::could not provision a domain"; exit 1; }
          echo "domain=$D" >> "$GITHUB_OUTPUT"
          echo "public domain: $D"

      - name: Resolve allowed origins (Vercel + dev + Capacitor)
        id: origins
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          set -e
          ORIGINS="capacitor://localhost http://localhost http://localhost:3000"
          if [ -n "$VERCEL_TOKEN" ] && [ -n "$VERCEL_PROJECT_ID" ]; then
            EXTRA=$(curl -sf -H "Authorization: Bearer $VERCEL_TOKEN" \
              "https://api.vercel.com/v9/projects/$VERCEL_PROJECT_ID" \
              | python3 -c 'import json,sys
          d=json.load(sys.stdin)
          domains=set()
          for a in d.get("alias") or []: domains.add("https://"+a["domain"])
          t=(d.get("targets") or {}).get("production") or {}
          for a in t.get("alias") or []: domains.add("https://"+a)
          print(" ".join(sorted(domains)))' || true)
            [ -n "$EXTRA" ] && ORIGINS="$ORIGINS $EXTRA"
          fi
          echo "origins=$ORIGINS" >> "$GITHUB_OUTPUT"
          echo "allowed_origins: $ORIGINS"

      - name: Configure all service variables
        env:
          DOMAIN: ${{ steps.dom.outputs.domain }}
          ORIGINS: ${{ steps.origins.outputs.origins }}
          SA_SERVICE: ${{ steps.ids.outputs.sa_service }}
          EB_SERVICE: ${{ steps.ids.outputs.eb_service }}
        run: |
          set -e
          railway variable set --service centrifugo \
            "CENTRIFUGO_CLIENT_TOKEN_HMAC_SECRET_KEY=$CENTRIFUGO_TOKEN_SECRET" \
            "CENTRIFUGO_HTTP_API_KEY=$CENTRIFUGO_API_KEY" \
            "CENTRIFUGO_CLIENT_ALLOWED_ORIGINS=$ORIGINS" \
            "PORT=8000" \
            --json
          railway variable set --service "$SA_SERVICE" \
            "CENTRIFUGO_URL=http://centrifugo.railway.internal:8000" \
            "CENTRIFUGO_WS_URL=wss://$DOMAIN/connection/websocket" \
            "CENTRIFUGO_API_KEY=$CENTRIFUGO_API_KEY" \
            "CENTRIFUGO_TOKEN_SECRET=$CENTRIFUGO_TOKEN_SECRET" \
            --json
          if [ -n "$EB_SERVICE" ]; then
            railway variable set --service "$EB_SERVICE" \
              "CENTRIFUGO_URL=http://centrifugo.railway.internal:8000" \
              "CENTRIFUGO_WS_URL=wss://$DOMAIN/connection/websocket" \
              "CENTRIFUGO_API_KEY=$CENTRIFUGO_API_KEY" \
              "CENTRIFUGO_TOKEN_SECRET=$CENTRIFUGO_TOKEN_SECRET" \
              "LOCATION_PUBLISH_MIN_INTERVAL_SECONDS=8" \
              --json
          else
            echo "employee-api is a different Railway project — set its variables via the employee repo workflow."
          fi

      - name: Publish smoke test
        env:
          DOMAIN: ${{ steps.dom.outputs.domain }}
        run: |
          set -e
          sleep 30  # variable-triggered restarts settle
          for i in 1 2 3 4 5 6 7 8; do
            R=$(curl -sf "https://$DOMAIN/health" || true); [ "$R" = "{}" ] && break; sleep 15
          done
          [ "$R" = "{}" ] || { echo "::error::not healthy after vars"; exit 1; }
          R=$(curl -s -X POST "https://$DOMAIN/api/publish" \
            -H "X-API-Key: $CENTRIFUGO_API_KEY" -H "Content-Type: application/json" \
            -d '{"channel":"priv:prop:smoke:tasks","data":{"type":"smoke","data":{}}}')
          echo "publish: $R"
          [ "${R#*result}" != "$R" ] || [ "$R" = "{}" ] || exit 1
          BAD=$(curl -s -o /dev/null -w '%{http_code}' -X POST "https://$DOMAIN/api/publish" \
            -H "X-API-Key: wrong" -H "Content-Type: application/json" \
            -d '{"channel":"priv:prop:smoke:tasks","data":{}}')
          echo "bad-key HTTP status: $BAD"
          [ "$BAD" = "401" ] || [ "$BAD" = "403" ] || exit 1
          {
            echo "## Centrifugo deployed"
            echo "- Public WS URL: \`wss://$DOMAIN/connection/websocket\`"
            echo "- Public API: \`https://$DOMAIN\`"
            echo "- Internal publish URL: \`http://centrifugo.railway.internal:8000\`"
          } >> "$GITHUB_STEP_SUMMARY"
