# Railway deployment — Super Admin API service.
# Service root directory: backend/ (alembic.ini + app/ live here).
# Nixpacks auto-detects Python via requirements.txt / pyproject.toml.

[build]
builder = "NIXPACKS"

[deploy]
# Apply migrations, then serve. Boot refuses to start on stale schema, so
# migrations MUST run first in the same release.
startCommand = "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port ${PORT:-8000} --proxy-headers"
healthcheckPath = "/health"
healthcheckTimeout = 300
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 5
